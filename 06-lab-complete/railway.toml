# Railway — deploy từ thư mục 06-lab-complete:  railway up
# Biến môi trường (AGENT_API_KEY, REDIS_URL...) đặt trên dashboard / `railway variables`, không ghi ở đây.
# Railway tự cấp biến PORT; CMD trong Dockerfile lắng nghe theo ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
