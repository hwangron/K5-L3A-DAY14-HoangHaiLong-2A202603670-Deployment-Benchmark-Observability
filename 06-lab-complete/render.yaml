# Render Blueprint — phương án thay cho railway.toml.
# Render đọc render.yaml ở GỐC repo: khi dùng, copy file này ra gốc (rootDir đã trỏ vào 06-lab-complete).
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh secret, không ghi giá trị trong file
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue                   # Redis-compatible (Render Key Value)
    name: agent-redis
    plan: free
    region: singapore
    ipAllowList: []                  # chỉ cho service nội bộ kết nối
    maxmemoryPolicy: noeviction
